<script>
'use strict';
/* =====================================================================
   こどものいうとおり  v0.3
   子どもの「言ったもん勝ち」の言葉で、大人の言葉（かたい活字）をこえていく。
   年齢が上がるほど言葉の力は弱まり、世界の色はうすくなり、夕日はしずむ。
   さいごに残るのは、さいしょに書いた「ゆめ」のカード。
   ---------------------------------------------------------------------
   ▼▼▼ ここから下の「データ」を書きかえると、中身を差しかえられます ▼▼▼
   ===================================================================== */

// デバッグ用（N キーで次の場面へ）。提出前に false にする。
// ============================================================
// こどものいうとおり：絵の部品（canvas 2D の手続き描画だけ。外部素材なし）
// 使い方：Art.setLook(age,color) → Art.drawScene(ctx,t,{camX}) → 各部品
//   age   0=6歳 .25=8歳 .5=10歳 .75=12歳 1=15歳 1.3=エピローグ（夜）
//   color 0=そのまま 1=色がもどった世界
// 座標は 1280x720、地面 GY=560、水平線 HZ=448（本体と同じ）
// ============================================================
const Art = (() => {
'use strict';
const W = 1280, H = 720, GY = 560, HZ = 448, TAU = Math.PI * 2, SUNX = 880;
const FONT_KID   = "'UD デジタル 教科書体 NK-R','Hiragino Maru Gothic ProN','BIZ UDPGothic','Yu Gothic','Meiryo',sans-serif";
const FONT_ADULT = "'Yu Mincho','BIZ UDPMincho','Hiragino Mincho ProN','MS PMincho',serif";
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, k) => a + (b - a) * k, smooth = k => k * k * (3 - 2 * k);
const mix = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
function rnd(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, w | 0); c.height = Math.max(1, h | 0); return c; };
function rr(g, x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); g.beginPath(); g.moveTo(x + r, y); g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r); g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h); g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r); g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y); g.closePath(); }

// ---------- 見た目の状態（年齢で色があせ、線がまっすぐになる） ----------
const LOOK = { d: 0, age: 0, color: 0, sat: 1, wob: 1 };
function setLook(age, color = 0) {
  const d = clamp(age, 0, 1.3), c = clamp(color, 0, 1);
  LOOK.age = d; LOOK.d = Math.round((d > .9 ? lerp(d, .84, c) : d) * 40) / 40; LOOK.color = c;
  const base = lerp(1, .40, smooth(clamp(d, 0, 1))) * (d > 1 ? lerp(1, .6, (d - 1) / .3) : 1);
  LOOK.sat = Math.round(lerp(base, 1.1, c) * 20) / 20;
  LOOK.wob = lerp(lerp(1, .06, clamp(d, 0, 1)), 1, c);
}
function tone(c, a = 1, sat = LOOK.sat) { const g = c[0] * .3 + c[1] * .59 + c[2] * .11; return `rgba(${clamp(g + (c[0] - g) * sat, 0, 255) | 0},${clamp(g + (c[1] - g) * sat, 0, 255) | 0},${clamp(g + (c[2] - g) * sat, 0, 255) | 0},${a})`; }
const kidSat = () => Math.min(1.15, LOOK.sat * 1.2 + .08);
const hsl = (h, s, l, a = 1, k = 1) => `hsla(${((h % 360) + 360) % 360},${clamp(s * k, 0, 100)}%,${l}%,${a})`;

// ---------- 色の鍵（時間帯ごと。間はなめらかに補間） ----------
const KEY = [0, .25, .5, .75, 1, 1.3];
function kf(arr, d) { d = clamp(d, 0, 1.3); let i = 0; while (i < KEY.length - 2 && d > KEY[i + 1]) i++; const k = (d - KEY[i]) / (KEY[i + 1] - KEY[i]); const a = arr[i], b = arr[i + 1]; return typeof a === 'number' ? lerp(a, b, k) : mix(a, b, k); }
const PAL = {
  top:  [[58,112,186],[52,90,172],[44,58,138],[36,30,98],[13,19,66],[6,9,32]],
  hi:   [[126,170,214],[122,134,196],[112,84,156],[92,54,128],[36,42,112],[13,19,58]],
  mid:  [[246,198,140],[244,156,116],[236,104,100],[186,76,128],[98,74,146],[30,34,84]],
  low:  [[255,224,156],[255,194,116],[255,152,92],[252,124,84],[228,116,126],[58,58,108]],
  hz:   [[255,240,190],[255,220,138],[255,186,104],[255,156,88],[250,158,108],[88,82,128]],
  sun:  [[255,252,232],[255,242,196],[255,218,146],[255,176,104],[255,146,96],[255,150,110]],
  seaN: [[46,112,150],[50,92,142],[50,62,122],[42,42,98],[18,26,72],[8,13,40]],
  sil:  [[70,58,82],[60,42,70],[50,30,62],[36,22,54],[17,15,42],[7,8,24]],
  road: [[186,156,128],[164,124,110],[112,82,94],[80,58,80],[40,38,66],[18,20,40]],
  roadD:[[120,92,88],[96,68,78],[62,44,66],[44,32,56],[22,22,44],[10,11,26]],
  grass:[[96,134,70],[88,114,64],[70,86,62],[50,60,58],[24,34,50],[11,17,30]],
  sunY: [236, 292, 346, 402, 468, 560],
};
const sunColor = () => kf(PAL.sun, LOOK.d);
const sunXY = (camX = 0) => ({ x: SUNX - camX * .012, y: kf(PAL.sunY, LOOK.d) });

// ---------- キャッシュ（重い層はオフスクリーンに焼く） ----------
const cache = new Map();
function lruGet(m, k) { const c = m.get(k); if (c) { m.delete(k); m.set(k, c); } return c; }
function lruPut(m, k, c, max, drop) { if (m.size >= max) { let n = drop; for (const key of m.keys()) { m.delete(key); if (--n <= 0) break; } } m.set(k, c); }
function baked(key, make) { const k = key + '|' + LOOK.d + '|' + LOOK.sat; let c = lruGet(cache, k); if (!c) { c = make(); lruPut(cache, k, c, 520, 60); } return c; }
function bakedRaw(key, make) { let c = lruGet(cache, key); if (!c) { c = make(); lruPut(cache, key, c, 520, 60); } return c; }

// ---------- 質感：紙のつぶ・コンクリート ----------
function noiseTile(size, seed, lo, hi, alpha) { const c = mk(size, size), g = c.getContext('2d'), im = g.createImageData(size, size), r = rnd(seed); for (let i = 0; i < size * size; i++) { const v = lo + (hi - lo) * r(), a = alpha * (.3 + .7 * r()); im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = a; } g.putImageData(im, 0, 0); return c; }
function paperOverlay() { return bakedRaw('paper', () => {
  const c = mk(W, H), g = c.getContext('2d');
  g.fillStyle = g.createPattern(noiseTile(192, 5, 0, 60, 11), 'repeat'); g.fillRect(0, 0, W, H);
  g.fillStyle = g.createPattern(noiseTile(160, 9, 215, 255, 9), 'repeat'); g.fillRect(0, 0, W, H);
  const r = rnd(3); g.lineCap = 'round';                       // 紙のせんい
  for (let i = 0; i < 520; i++) { const x = r() * W, y = r() * H, l = 6 + r() * 26, a = r() * TAU; g.strokeStyle = r() < .5 ? 'rgba(255,250,235,.05)' : 'rgba(30,20,40,.045)'; g.lineWidth = .6 + r(); g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l * .4); g.stroke(); }
  const v = g.createRadialGradient(W / 2, H * .46, H * .34, W / 2, H * .5, H * .98);                // まわりを少し暗く
  v.addColorStop(0, 'rgba(18,8,36,0)'); v.addColorStop(.72, 'rgba(18,8,36,.10)'); v.addColorStop(1, 'rgba(14,6,30,.42)');
  g.fillStyle = v; g.fillRect(0, 0, W, H);
  return c; }); }
function drawPaper(ctx) { ctx.drawImage(paperOverlay(), 0, 0); }
function concreteTile() { return bakedRaw('concrete', () => { const c = noiseTile(128, 21, 0, 255, 70), g = c.getContext('2d'), r = rnd(8); for (let i = 0; i < 26; i++) { g.fillStyle = `rgba(${r() < .5 ? 20 : 235},${r() < .5 ? 20 : 235},${r() < .5 ? 30 : 235},.10)`; g.beginPath(); g.ellipse(r() * 128, r() * 128, 2 + r() * 9, 1 + r() * 5, r() * 3, 0, TAU); g.fill(); } return c; }); }

// ---------- 逆光のふちどり：形を焼いて、太陽側に明るい影を1枚しく ----------
const SCR = { a: mk(480, 420) };
// （ふちの光は canvas の影の機能で、色つきのずらした写しを1回で描く。dx・dy は画面上の向き）
function withRim(ctx, x, y, ox, oy, rimCss, dx, dy, drawFn, w = 480, h = 420) {
  const a = SCR.a, ag = a.getContext('2d');
  ag.setTransform(1, 0, 0, 1, 0, 0); ag.globalAlpha = 1; ag.globalCompositeOperation = 'source-over'; ag.clearRect(0, 0, w, h); ag.save(); ag.beginPath(); ag.rect(0, 0, w, h); ag.clip(); ag.translate(ox, oy); drawFn(ag); ag.restore();
  ctx.save(); ctx.shadowColor = rimCss; ctx.shadowBlur = 0; ctx.shadowOffsetX = dx; ctx.shadowOffsetY = dy; ctx.drawImage(a, 0, 0, w, h, x - ox, y - oy, w, h); ctx.restore();
}

// ============================================================
// 1. 空
// ============================================================
function bakeSky() { const d = LOOK.d, c = mk(W, HZ + 44), g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 0, HZ + 44);
  gr.addColorStop(0, tone(kf(PAL.top, d))); gr.addColorStop(.30, tone(kf(PAL.hi, d))); gr.addColorStop(.60, tone(kf(PAL.mid, d))); gr.addColorStop(.84, tone(kf(PAL.low, d))); gr.addColorStop(.97, tone(kf(PAL.hz, d))); gr.addColorStop(1, tone(kf(PAL.hz, d)));
  g.fillStyle = gr; g.fillRect(0, 0, W, HZ + 44);
  const r = rnd(11), lit = mix(kf(PAL.hz, d), [255, 235, 215], .35);       // うすい すじ雲
  for (let i = 0; i < 20; i++) { const x = r() * W, y = 30 + r() * 300, w = 160 + r() * 420, h = 2 + r() * 7; const sg = g.createLinearGradient(x - w / 2, 0, x + w / 2, 0); const a = (.08 + r() * .2) * (d > 1 ? .4 : 1); sg.addColorStop(0, tone(lit, 0)); sg.addColorStop(.5, tone(lit, a)); sg.addColorStop(1, tone(lit, 0)); g.fillStyle = sg; g.save(); g.translate(x, y); g.rotate(-.05 + r() * .04); g.beginPath(); g.ellipse(0, 0, w / 2, h, 0, 0, TAU); g.fill(); g.restore(); }
  sunGlow(g, d, SUNX);
  return c; }
function sunGlow(g, d, sx) { const sy = kf(PAL.sunY, d), col = sunColor(), k = (d <= 1 ? 1 : lerp(1, .22, (d - 1) / .3)) * lerp(.5, 1, clamp(d * 1.6, 0, 1)), sr = lerp(38, 62, clamp(d, 0, 1));
  g.save(); g.globalCompositeOperation = 'lighter';
  let rg = g.createRadialGradient(sx, sy, 0, sx, sy, 640); rg.addColorStop(0, tone(col, .40 * k)); rg.addColorStop(.35, tone(col, .16 * k)); rg.addColorStop(1, tone(col, 0)); g.fillStyle = rg; g.fillRect(0, 0, W, HZ + 44);
  rg = g.createRadialGradient(sx, sy, 0, sx, sy, 230); rg.addColorStop(0, tone(col, .55 * k)); rg.addColorStop(1, tone(col, 0)); g.fillStyle = rg; g.fillRect(0, 0, W, HZ + 44);
  if (d > .6) { const b = g.createLinearGradient(0, HZ - 70, 0, HZ + 20); b.addColorStop(0, tone(kf(PAL.low, d), 0)); b.addColorStop(1, tone(kf(PAL.hz, d), .3 * k)); g.fillStyle = b; g.fillRect(0, HZ - 70, W, 100); }  // 水平線の ざんこう
  g.restore();
  if (sy < HZ + 50) { const dg = g.createRadialGradient(sx, sy, 0, sx, sy, sr * 1.25); dg.addColorStop(0, 'rgba(255,255,246,1)'); dg.addColorStop(.62, tone(mix(col, [255, 255, 240], .5), 1)); dg.addColorStop(.8, tone(col, .92)); dg.addColorStop(1, tone(col, 0)); g.fillStyle = dg; g.beginPath(); g.arc(sx, sy, sr * 1.25, 0, TAU); g.fill(); }
}
function drawRays(ctx, t, camX) { const d = LOOK.d; if (d > 1.12) return; const s = sunXY(camX), col = sunColor(), fade = d > .85 ? clamp((1.12 - d) / .27, 0, 1) : 1;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, HZ + 2); ctx.clip(); ctx.globalCompositeOperation = 'lighter';
  const rg = ctx.createRadialGradient(s.x, s.y, 30, s.x, s.y, 1000); rg.addColorStop(0, tone(col, .5)); rg.addColorStop(.5, tone(col, .14)); rg.addColorStop(1, tone(col, 0)); ctx.fillStyle = rg;
  for (let i = 0; i < 15; i++) { const a = i / 15 * TAU + t * .015 + Math.sin(i * 7.3) * .22, w = .018 + .05 * hash(i * 3.1); ctx.globalAlpha = (.10 + .12 * (.5 + .5 * Math.sin(t * .45 + i * 2.1))) * fade; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + Math.cos(a - w) * 1300, s.y + Math.sin(a - w) * 1300); ctx.lineTo(s.x + Math.cos(a + w) * 1300, s.y + Math.sin(a + w) * 1300); ctx.closePath(); ctx.fill(); }
  ctx.restore(); }
function bakeCloud(seed, w, h) { const d = LOOK.d, r = rnd(seed), m = mk(w, h), mg = m.getContext('2d'); mg.fillStyle = '#fff';
  const n = 8 + (r() * 6 | 0); for (let i = 0; i < n; i++) { const u = i / (n - 1), pr = h * (.16 + .24 * Math.sin(Math.PI * u)) * (.75 + r() * .5), px = w * (.14 + .72 * u) + (r() - .5) * 18, py = h * .68 - pr * (.5 + r() * .45); mg.beginPath(); mg.arc(px, py, pr, 0, TAU); mg.fill(); }
  mg.beginPath(); mg.ellipse(w / 2, h * .70, w * .40, h * .13, 0, 0, TAU); mg.fill();
  const c = mk(w, h), g = c.getContext('2d'); try { g.filter = 'blur(2px)'; } catch (e) {} g.drawImage(m, 0, 0); try { g.filter = 'none'; } catch (e) {}
  const dk = smooth(clamp(d * 1.25, 0, 1)), top = mix([252, 246, 240], mix(kf(PAL.hi, d), [96, 74, 124], .5), lerp(.12, 1, dk)), lit = d > 1 ? mix(kf(PAL.low, d), [120, 110, 170], .4) : mix(kf(PAL.hz, d), [255, 206, 176], lerp(.55, .3, dk));
  g.globalCompositeOperation = 'source-in'; const vg = g.createLinearGradient(0, h * .12, 0, h * .84); vg.addColorStop(0, tone(top, .96)); vg.addColorStop(.55, tone(mix(top, lit, .42), .96)); vg.addColorStop(1, tone(lit, 1)); g.fillStyle = vg; g.fillRect(0, 0, w, h);
  const o = mk(w + 60, h + 60), og = o.getContext('2d'); og.shadowColor = tone(lit, d > 1 ? .25 : .7); og.shadowBlur = 22; og.shadowOffsetY = 8; og.drawImage(c, 30, 24); og.shadowColor = 'transparent'; og.drawImage(c, 30, 24);
  return o; }
const CLOUDS = (() => { const r = rnd(41), a = []; for (let i = 0; i < 13; i++) a.push({ x: r() * 3000, y: 40 + r() * 230, sp: i % 6, s: .5 + r() * .75, par: .03 + r() * .06, drift: 3 + r() * 5 }); return a.sort((p, q) => p.s - q.s); })();
function drawClouds(ctx, t, camX) { for (const c of CLOUDS) { const sp = baked('cloud' + c.sp, () => bakeCloud(100 + c.sp * 17, 380 + c.sp * 40, 150 + (c.sp % 3) * 26)); const L = 3000, x = (((c.x - camX * c.par - t * c.drift) % L) + L) % L - 520; if (x > W + 20) continue; ctx.globalAlpha = lerp(.9, .98, c.s - .5); ctx.drawImage(sp, x, c.y, sp.width * c.s, sp.height * c.s); } ctx.globalAlpha = 1; }
const STARS = (() => { const r = rnd(77), a = []; for (let i = 0; i < 90; i++) a.push({ x: r() * W, y: r() * 330, s: .6 + r() * 1.5, p: r() * TAU, sp: 1 + r() * 2.5 }); return a; })();
function drawStars(ctx, t) { const d = LOOK.d, a0 = clamp((d - .5) / .5, 0, 1) * (d > 1 ? 1.25 : 1); ctx.save(); ctx.globalCompositeOperation = 'lighter';
  if (a0 > 0) for (const s of STARS) { const a = a0 * (1 - s.y / 420) * (.45 + .55 * Math.sin(t * s.sp + s.p)); if (a <= .02) continue; ctx.fillStyle = `rgba(255,246,225,${a})`; ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, TAU); ctx.fill(); }
  const f = clamp((d - .3) / .3, 0, 1); if (f > 0) { const x = 318, y = 96, tw = .75 + .25 * Math.sin(t * 2.2); ctx.fillStyle = `rgba(255,250,235,${.95 * f})`; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, TAU); ctx.fill(); ctx.strokeStyle = `rgba(255,246,220,${.5 * f * tw})`; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x - 11 * tw, y); ctx.lineTo(x + 11 * tw, y); ctx.moveTo(x, y - 13 * tw); ctx.lineTo(x, y + 13 * tw); ctx.stroke(); }   // いちばん星
  ctx.restore(); }
function drawBirds(ctx, t, camX) { const d = LOOK.d; if (d > 1.05) return; ctx.save(); ctx.strokeStyle = tone(kf(PAL.sil, d), .8); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 0; i < 7; i++) { const bx = ((1500 - t * (20 + i * 1.5) - i * 46 - camX * .05) % 1700 + 1700) % 1700 - 200, by = 150 + Math.sin(t * .4 + i) * 12 + (i % 3) * 22 + i * 5, fl = Math.sin(t * 7 + i * 1.7), s = 6 + (i % 3) * 2; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx - s, by - fl * s * .55); ctx.quadraticCurveTo(bx - s * .4, by - s * .25 - fl * 2, bx, by); ctx.quadraticCurveTo(bx + s * .4, by - s * .25 - fl * 2, bx + s, by - fl * s * .55); ctx.stroke(); }

// 完全一致でだけ「まだ きめてない」にする短い言葉
const DREAM_UNDECIDED_EXACT = ['ない','なし','無し','無い','むり','さあ','べつに','別に','ひみつじゃないけどない','?','？','…','。。。','-','ー'];

// ---- 正規化：全角半角・カタカナ→ひらがな・小文字・空白と記号を除く ----
function normalizeDream(text){
  if (text == null) return '';
  let s = String(text);
  try { s = s.normalize('NFKC'); } catch(e) {}
  s = s.toLowerCase();
  // カタカナ → ひらがな（ァ〜ヶ）
  s = s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  // のばす音のゆれ（〜・―・－・ｰ）を「ー」に
  s = s.replace(/[〜～~―—–−－-]/g, 'ー');
  // 空白・句読点・記号を除く
  s = s.replace(/[\s　、。，．,.!！?？・「」『』（）()\[\]【】"'’”…:：;；/／\\☆★♪♡❤]/g, '');
  return s;
}

// ---- キーワードを正規化して覚えておく（最初の1回だけ） ----
let DREAM_KEY_CACHE = null;
function dreamKeyCache(){
  if (DREAM_KEY_CACHE) return DREAM_KEY_CACHE;
  const list = [];
  DREAM_TYPES.forEach((t, ti) => {
    const seen = {};
    t.keys.forEach(k => {
      const n = normalizeDream(k);
      if (n && !seen[n]) { seen[n] = 1; list.push({ key:n, type:t, order:ti }); }
    });
  });
  // 長いキーワードを先に。同じ長さなら DREAM_TYPES の並び順
  list.sort((a, b) => (b.key.length - a.key.length) || (a.order - b.order));
  DREAM_KEY_CACHE = list;
  return list;
}

function dreamTypeById(id){
  for (let i = 0; i < DREAM_TYPES.length; i++) if (DREAM_TYPES[i].id === id) return DREAM_TYPES[i];
  return null;
}

// ---- 判定：夢の文字 → DREAM_TYPES の1つ（必ず何かを返す） ----
function classifyDream(text){
  const s = normalizeDream(text);
  if (!s) return dreamTypeById('undecided');
  for (let i = 0; i < DREAM_UNDECIDED_EXACT.length; i++) {
    if (s === normalizeDream(DREAM_UNDECIDED_EXACT[i]) || s === DREAM_UNDECIDED_EXACT[i]) return dreamTypeById('undecided');
  }
  const list = dreamKeyCache();
  for (let i = 0; i < list.length; i++) {
    if (s.indexOf(list[i].key) !== -1) return list[i].type;   // 長い順なので最初の一致が最長
  }
  return dreamTypeById('own');
}

    if(inBtn(BTN.l,q)){ rec.role='l'; syncVkey(); return; } if(inBtn(BTN.r,q)){ rec.role='r'; syncVkey(); return; }

    }

  waves.push({x:P.x+P.w/2,y:P.y+P.h/2,t:0,hue:w.hue,v}); Art.burst(P.x+P.w/2,P.y+P.h/2-24,clamp(v,.08,1.2),w.hue);
  sfx(p<.2?'whisper':'shout',p); sfx(p>=.2?(w.id==='rewind'?'act':w.id):'fizz',p);
  puff(P.x+P.w/2,P.y+P.h/2,Math.round(50*p)+3,w.hue,{sp:260*p+40,r:8*p+2,s:90*(.2+.8*p)});

  else if(w.id==='wind') eff.wind=dur;

  }

// ゆめのことば：ステージごとに1回。年で よわまらない（ゆめは 色あせない）。きめ手ではなく、たすけに なる つよさ

  else if(fx==='refill'){ const k=HAND.find(i=>used[i]); if(k!==undefined){ used[k]=false; setNote('もういっかい つかえる',k); } else spare++; }
  else if(fx==='hush'){ eff.hush=4.5; }

  else if(fx==='reveal'||fx==='reveal2'){ eff.memory=Math.max(eff.memory,6); ST.memorized=true; if(fx==='reveal2') for(const b of ST.backs) if(!b.final) b.a=Math.max(b.a,.9); }
  else if(fx==='carry'){ eff.carry=1.3; }
  else if(fx==='bridge'){ const q=ST.pits.filter(q=>q.x+q.w>P.x&&q.x<P.x+600)[0]; if(q) ST.drawn.push({x:q.x-6,y:GY,w:Math.min(q.w+12,350),kind:'bridge'}); else { ok=false; setNote('ちかくに あなが ない',-2); } }
  else if(fx==='vine'){ for(let i=0;i<3;i++) ST.drawn.push({x:P.x+34+i*12,y:GY-80*(i+1),w:96,kind:'vine'}); }
  else if(fx==='invincible'){ eff.barrier=Math.max(eff.barrier,3.4); }
  if(!ok){ sfx('fizz'); return; }

  puff(P.x+P.w/2,P.y+P.h/2,40,DT.hue,{sp:260,r:8});

function lowerWall(w){ if(w.low) return; w.low=true; w.heard=true; heardBy[S.stage]++; sfx('soften'); puff(w.x+35,w.y+40,30,40,{sp:200,r:7,up:80}); }
function respawn(){

// ---------- 当たり判定 ----------
function solidsNow(){
  const a=ST.solids.concat(ST.blocks), ball=isBall();
  for(const w of ST.walls) if(!w.broken&&!w.door&&!w.ghost&&!(ball&&!w.final)) a.push(w);
  for(const c of ST.chasers) if(c.on&&c.frozen>0&&c.drop>=1&&!ball) a.push({x:c.cx,y:GY-c.s,w:c.text.length*c.s,h:c.s});   // とまっている あいだは、うえに のれる
  return a;
}
// うえからだけ のれる あしば（かくれた足場・だん・かいた足場・かげの みち・ふね）
function platsNow(){
  let a=ST.hidden.concat(ST.ledges,ST.drawn);
  if(ST.shadowPath) a=a.concat(ST.pits.map(p=>({x:p.x-6,y:GY,w:p.w+12})));
  if(seaLv>.3) for(const b of ST.boats) a.push({x:b.x,y:b.y,w:b.w,boat:b});
  return a;
}
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;

function movePlayer(dt,ax,jump){
  const p=P.adult?0:clamp(curAge().power,0,1);
  P.rideBoat=null; P.onView=false; P.onCloud=false;
  if(eff.carry>0&&!P.adult){ // ゆめのことば：とりや のりものが、すこし はこんでくれる
    const ox=P.x, oy=P.y; P.x+=320*dt; P.y=lerp(P.y,GY-190-P.h,clamp(dt*6,0,1)); P.vx=0; P.vy=0; P.on=false; P.air=.2; P.dir=1; P.walk+=dt*8;
    if(solidsNow().some(s=>hit(P,s))||P.x>ST.len-P.w){ P.x=ox; P.y=oy; eff.carry=0; }
    return;
  }
  const surf=GY-waterH*seaLv, windOn=eff.wind>0&&!P.adult, windSea=windOn&&seaLv>.5;
  P.inWater = seaLv>.15 && P.y+P.h*.55>surf && !windSea;
  const sp=P.inWater?200:WALK*(windOn?1+2*p:1)*(P.adult?.75:1);
  P.vx=lerp(P.vx,ax*sp,clamp(dt*14,0,1));
  if(ax) P.dir=ax;
  if(P.inWater){
    P.vy=lerp(P.vy,(P.y+P.h*.3>surf)?-190:40,clamp(dt*6,0,1));
    if(jump) P.vy=-300;
  } else {
    // 風になっているあいだは、走りぬける（少しのあいだ落ちない）
    if(windOn&&Math.abs(P.vx)>330&&P.air<.5*Math.min(1,p*1.4)&&P.vy>=0&&!P.on) P.vy=0;
    else P.vy+=GRAV*dt*((DT.passive==='slowfall'&&P.vy>0&&!P.adult)?.72:1)*(eff.float>0?.25:1);      // ゆめ（そら）：おちるのが ゆっくり
    if(jump&&(P.on||P.air<.08)){ P.vy=-JUMP*((DT.passive==='jump'&&!P.adult)?1.1:1)*(P.big>0?1.45:1); P.big=0; sfx('jump'); P.on=false; P.air=1; }   // ゆめ（うんどう）：ジャンプが すこし たかい
  }
  P.vy=clamp(P.vy,-1200,1100);
  const sol=solidsNow();
  // よこ
  P.x+=P.vx*dt;
  for(const s of sol) if(hit(P,s)){
    if(P.vy>=0&&P.y+P.h-s.y<=16){ P.y=s.y-P.h; continue; }      // 小さな段は自動でのぼる
    if(s.isWall) ST.last=s;                                      // さいごに さわった壁
    if(P.vx>0) P.x=s.x-P.w; else if(P.vx<0) P.x=s.x+s.w; else P.x=(P.x+P.w/2<s.x+s.w/2)?s.x-P.w:s.x+s.w; P.vx=0;
  }
  P.x=clamp(P.x,0,ST.len-P.w);
  // たて
  const py=P.y; P.y+=P.vy*dt; P.on=false;
  for(const s of sol) if(hit(P,s)){ if(P.vy>0){ P.y=s.y-P.h; P.on=true; } else { P.y=s.y+s.h; } P.vy=0; }
  // かくれた足場（上からだけ乗れる。見えなくても、ある）
  if(P.vy>=0&&!keys.ArrowDown){
    for(const c of platsNow()){
      if(P.x+P.w>c.x&&P.x<c.x+c.w&&py+P.h<=c.y+(c.boat?8:2)&&P.y+P.h>=c.y){ P.y=c.y-P.h; P.vy=0; P.on=true; if(c.boat) P.rideBoat=c.boat; if(c.view) P.onView=true; if(c.cloud) P.onCloud=true; }
    }
  }
  // 「おれは かぜ」＋「ここは うみ」＝ 海の上を走れる
  if(windSea&&P.vy>=0&&P.y+P.h>=surf-3){
    const oy=P.y; P.y=Math.max(surf-P.h,P.y-520*dt); P.vy=0;
    for(const s of sol) if(hit(P,s)){ P.y=oy; break; }
    if(P.y<=surf-P.h+2){ P.on=true; if(Math.abs(P.vx)>200&&S.mode==='play'&&surf<GY-30) addCombo('seawind'); if(Math.abs(P.vx)>200&&Math.random()<.7) puff(P.x+P.w/2,surf,1,200,{sp:90,up:120,r:5,life:.5,vx:-P.vx*.2}); }
  }
  if(P.on) P.air=0; else P.air+=dt;
  if(Math.abs(P.vx)>20&&(P.on||P.inWater)) P.walk+=dt*Math.min(Math.abs(P.vx),420)/22;
}

// ---------- 更新 ----------
function update(dt){
  T+=dt; S.t+=dt; boil=Math.floor(T*7);
  shake=Math.max(0,shake-dt); flash=Math.max(0,flash-dt);
  if(note){ note.t+=dt; if(note.t>1.8) note=null; }
  const enter=pressed.has('Enter')||pressed.has('NumpadEnter');
  let click=clickPos; clickPos=null;
  if(pressed.has('KeyM')){ muted=!muted; try{ GameAudio.setMuted(muted); }catch(e){} }
  audioSync();

  // ねらう色・ゆらぎ・夕日へ、なめらかに
  let tSat=1,tWob=3,tSunk=.12;
  if(S.mode==='ending'){ tSat=END.sat; tWob=END.sat>.5?3:0; tSunk=END.sunk; }
  else if(S.mode==='dark'){ tSat=.1; tWob=0; tSunk=1.3; }
  else if(S.mode==='result'){ tSat=1; tWob=2.5; }
  else if(S.mode==='intro'||S.mode==='play'||S.mode==='clear'){
    tSat=curAge().sat; tWob=curAge().wob; tSunk=curAge().sunk;
    if(P&&P.onCloud){ tSat=1.05; tWob=2.6; }       // 雲の上は、はれている
    if(S.mode==='clear'&&S.t>1.5) tSat=Math.max(tSat,.9);   // 「おかえり」の あいだ、色が もどる
    if(ST.finalWall&&(ST.finalWall.door||ST.finalWall.broken)){ tSat=route==='child'?1:.8; tWob=2.2; }
    if(absorb){ tSat=0; tWob=0; }      // ゆめのカードで、少し色が戻る
  }
  SAT=lerp(SAT,tSat,clamp(dt*2.5,0,1)); WOB=lerp(WOB,tWob,clamp(dt*2.5,0,1)); SUNK=lerp(SUNK,tSunk,clamp(dt*1.2,0,1));
  { let tA=0, tC=0;      // 絵の 年と、色の もどり
    if(S.mode==='intro'||S.mode==='play'||S.mode==='clear'){ tA=S.stage*.25; if(P&&P.onCloud) tC=1; if(S.mode==='clear'&&S.t>1.5) tC=Math.max(tC,.75);
      if(ST&&ST.finalWall&&(ST.finalWall.door||ST.finalWall.broken)) tC=route==='child'?1:.7; if(absorb) tC=0; }
    else if(S.mode==='dark'){ tA=1.3; } else if(S.mode==='ending'&&END){ tA=1.3; tC=END.ringDone?1:0; LC=tC; }
    LA=Math.abs(tA-LA)<.004?tA:lerp(LA,tA,clamp(dt*1.6,0,1)); LC=Math.abs(tC-LC)<.01?tC:lerp(LC,tC,clamp(dt*1.8,0,1)); }

  if(DEBUG&&pressed.has('KeyN')){ debugNext(); pressed.clear(); return; }

  if(S.mode==='title'){
    camX+=dt*40;
    if(pressed.has('ArrowLeft')||pressed.has('ArrowRight')||pressed.has('KeyA')||pressed.has('KeyD')) diff=diff==='easy'?'normal':'easy';
    if(click&&click.y>=DIFB.y&&click.y<=DIFB.y+DIFB.h){ if(click.x>=DIFB.x1&&click.x<=DIFB.x1+DIFB.w){ diff='easy'; click=null; } else if(click.x>=DIFB.x2&&click.x<=DIFB.x2+DIFB.w){ diff='normal'; click=null; } }
    if(foundEndings().length>0){ if(pressed.has('KeyF')) few=!few; if(click&&inBtn(FEWB,click)){ few=!few; click=null; sfx('card'); } } else few=false;
    if(S.t>.3&&(enter||pressed.has('Space')||click)){ S.mode='howto'; S.t=0; seenW=new Set(); sfx('card'); }
  }
  else if(S.mode==='howto'){
    camX+=dt*40;
    if(S.t>.7&&(enter||pressed.has('Space')||click)) askDream();
  }
  else if(S.mode==='dream'){
    camX+=dt*40;
    if(click&&S.t>.35){ const k=dreamChoiceAt(click.x,click.y); if(k>=0) confirmDream(DREAM_CHOICES[k]); else if(inBtn(DOK,click)) confirmDream(inp.value); else if(!TOUCH) inp.focus(); else inp.blur(); }
  }
  else if(S.mode==='intro'){
    if(introWait){ if(S.t>1.3&&(enter||pressed.has('Space')||click)){ for(const k of introWait.all) seenW.add(k); introWait=null; S.mode='play'; S.t=0; sfx('card'); } }
    else if(S.t>2.6||(S.t>.4&&(enter||click))){ S.mode='play'; S.t=0; }
  }
  else if(S.mode==='play'){
    if(helpOn){ if(S.t>.25&&(enter||click||pressed.has('KeyH')||pressed.has('Escape')||pressed.has('Space'))){ helpOn=false; S.t=1; } }
    else if(pressed.has('KeyH')&&!choice&&!view&&!swing){ helpOn=true; S.t=0; charge=null; sfx('card'); }
    else updatePlay(dt,click);
  }
  else if(S.mode==='clear'){
    updateParts(dt);
    if(S.t>1.5&&!okT){ okT=1; sfx('okaeri'); }      // 「おかえり」は、どの年でも おなじ大きさ・おなじ色
    if(S.t>5||(S.t>2.6&&(enter||click))){ cleared[S.stage]=true; if(S.stage<AGES.length-1) startStage(S.stage+1); else { S.mode='dark'; S.t=0; } }
  }
  else if(S.mode==='dark'){
    if(S.t>(route==='adult'?7.5:4.5)||(S.t>1.2&&enter)){ startEnding(); }
  }
  else if(S.mode==='ending'){ updateEnding(dt,click,enter); }
  else if(S.mode==='result'){
    if(S.t>1&&(enter||click)){ S.mode='title'; S.t=0; ST=null; }
  }
  pressed.clear();
}

function updateParts(dt){
  Art.updateFx(dt);
  for(const q of parts){ q.life+=dt; q.vy+=q.grav*dt; q.x+=q.vx*dt; q.y+=q.vy*dt; }
  parts=parts.filter(q=>q.life<q.max);
  for(const s of shouts) s.t+=dt; shouts=shouts.filter(s=>s.t<(s.dream?3:1.9));
  for(const k of walkers){ k.t+=dt; if(k.t<k.delay) continue; k.vy+=GRAV*dt; k.y+=k.vy*dt; if(k.y>GY-k.s){ k.y=GY-k.s; k.vy=0; k.x+=k.vx*dt; } }
  walkers=walkers.filter(k=>k.x>camX-300);
  for(const w of ST.walls){ if(w.shakeT>0) w.shakeT-=dt; if(w.door>0&&w.door<1) w.door=Math.min(1,w.door+dt*1.1);
    if(w.low&&w.h>16){ w.h=Math.max(16,w.h-230*dt); w.y=GY-w.h; } }
  if(banner){ banner.t+=dt; if(banner.t>3.2) banner=null; }
}

function updatePlay(dt,click){
  if(pressed.has('KeyR')){ startStage(S.stage); S.mode='play'; return; }
  const enterK=pressed.has('Enter')||pressed.has('NumpadEnter');
  if(view){ // みはらし台：ゆうひを ながめる
    view.t+=dt; updateParts(dt); tickWaves(dt); if(view.t>4.6||(view.t>1.2&&(enterK||click))) view=null; return; }
  if(swing){ swing.t+=dt; updateParts(dt); tickWaves(dt); if(swing.t>2.8){ swing=null; addPlay('swing','ブランコ、たのしかった！'); } return; }
  // 15さい：3つの みち（どれも ゴールに つく）
  if(ST.choiceX&&!path15&&!choice&&P.x>ST.choiceX-20&&P.on&&!rew){ choice={t:0}; P.vx=0; charge=null; }
  if(choice){
    choice.t+=dt; updateParts(dt); tickWaves(dt); let k=-1;
    for(let i=0;i<3;i++) if(pressed.has('Digit'+(i+1))||pressed.has('Numpad'+(i+1))) k=i;
    if(click) for(let i=0;i<3;i++) if(inBtn(choiceBtn(i),click)) k=i;
    if(k>=0&&choice.t>.4){ path15=PATHS[k].id; choice=null; sfx('act',.6); banner={text:PATHS[k].name,t:0,hue:45}; }
    return;
  }
  { const list=slotList();
    for(let i=0;i<list.length;i++) if(pressed.has('Digit'+(i+1))||pressed.has('Numpad'+(i+1))){ const sl=list[i]; if(sl>=0) startCharge(sl,false); else if(sl===-1) useDream(); else useDW(); }
    if(pressed.has('Digit0')||pressed.has('Numpad0')) useDream();
    if(click){ const sl=slotAt(click.x,click.y); if(sl===-1) useDream(); else if(sl===-2) useDW();
      else if(sl===null&&P.on&&Math.abs(click.x-(P.x+P.w/2-camX))<44&&Math.abs(click.y-(P.y+P.h/2+WY))<70&&!inFinalZone()){ P.spin=.8; addPlay('spin','くるくる！'); } } }
  if(charge){ // おしているあいだ ためて、はなしたら さけぶ
    charge.t+=dt;
    const held=charge.ptr!==null?!charge.rel:(keys['Digit'+(charge.slot+1)]||keys['Numpad'+(charge.slot+1)]);
    if(!held||charge.t>4||rew){ const c=charge; charge=null; shout(c.k,chargeLv(c)); }
  }
  tickWaves(dt);
  if(absorb){ // うなずいた：かべに とりこまれる
    absorb.t+=dt; const f=ST.finalWall; f.ghost=true; P.x=Math.min(P.x+70*dt,f.x+f.w/2-P.w/2); P.y=Math.min(P.y+300*dt,GY-P.h); P.vx=P.vy=0; P.walk+=dt*4; P.dir=1;
    updateParts(dt); camX=lerp(camX,clamp(P.x-460,0,ST.len-W),clamp(dt*6,0,1));
    if(absorb.t>3.4){ S.mode='dark'; S.t=0; }
    return;
  }

  for(const k in eff) eff[k]=Math.max(0,eff[k]-dt);
  seaLv=lerp(seaLv,eff.sea>0?1:0,clamp(dt*(eff.sea>0?3:2),0,1));
  const p=curAge().power;

  if(rew){ // まき戻し中
    for(let i=0;i<rew.per&&rew.left>0&&hist.length>1;i++){ const h=hist.pop(); P.x=h.x; P.y=h.y; rew.left--; }
    if(Math.random()<.6) puff(P.x+P.w/2,P.y+P.h/2,1,285,{sp:60,r:5,grav:0,life:.5});
    if(rew.left<=0||hist.length<=1){ rew=null; P.vx=P.vy=0; letters=[]; }
  } else {
    const ax=(keys.ArrowRight||keys.KeyD||vkey.r?1:0)-(keys.ArrowLeft||keys.KeyA||vkey.l?1:0);
    const jump=pressed.has('Space')||pressed.has('ArrowUp')||pressed.has('KeyW');
    movePlayer(dt,ax,jump);
    // がんじょうさ：数がおかしい・かべに埋まった → 安全な場所へ戻す
    if(!isFinite(P.x)||!isFinite(P.y)||!isFinite(P.vx)||!isFinite(P.vy)){ P.x=ST.cps[0]; P.y=GY-P.h; P.vx=P.vy=0; }
    const core={x:P.x+5,y:P.y+5,w:P.w-10,h:P.h-10};
    if(solidsNow().some(s=>hit(core,s))) stuckT+=dt; else stuckT=0;
    if(stuckT>.3){ respawn(); stats.falls--; }
    hist.push({x:P.x,y:P.y}); if(hist.length>420) hist.shift();
    if(ax||jump||pressed.size||charge) idleT=0; else idleT+=dt;
    if(P.x>maxX+4){ maxX=P.x; stallT=0; } else stallT+=dt;
    // さいごの かべの前：↓（うなずく）か、20秒 なにもしない → おとなの いうとおり
    if(inFinalZone()&&(pressed.has('ArrowDown')||pressed.has('KeyS')||idleT>20)){ absorb={t:0}; route='adult'; charge=null; sfx('fizz'); }
    else updateExtras(dt,ax,jump);
  }
  if(eff.wind>0&&Math.abs(P.vx)>200&&Math.random()<.8) puff(P.x+P.w/2-P.dir*10,P.y+Math.random()*P.h,1,150,{sp:20,r:4,grav:0,life:.35,vx:-P.vx*.5,l:85});

  // 降ってくる大人の言葉
  const surf=GY-waterH*seaLv, opened=!!(ST.finalWall&&(ST.finalWall.door||ST.finalWall.broken));
  if(opened) letters=letters.filter(L=>!L.self);      // ゆめのカードで、じぶんの こえも きえる
  for(const r of ST.rains){
    const rt=r.self?SELF_VOICE:(r.text||ST.d.rainText);
    if(Math.abs(P.x-(r.x+r.w/2))<900&&!(r.self&&opened)&&eff.hush<=0){
      r.t-=dt;
      if(r.t<=0){ r.t=curAge().rainEvery*MODES[diff].every*(.7+Math.random()*.6);
        const lx=r.x+Math.random()*(r.w-40), cl=ST.cloud, ly=(cl&&lx>cl.x-30&&lx<cl.x+cl.w-10)?cl.y+30:-60;      // 雲の下では、雲から ふってくる（雲の上は はれている）
        letters.push({x:lx,y:ly,vy:(250+Math.random()*60)*MODES[diff].rain,vx:0,ch:rt[r.n++%rt.length],rot:0,vr:0,safe:false,s:40,self:r.self}); }
    }
  }
  const bub={x:P.x+P.w/2,y:P.y+P.h/2,r:38+52*Math.min(1,p*1.2)};
  for(const L of letters){
    if(!L.safe&&seaLv>.3&&L.y+L.s>surf){ L.safe=true; L.float=true; L.vy=0; }   // 海に落ちた文字は浮かぶ
    if(L.float){ L.y=lerp(L.y,surf-L.s*.6+Math.sin(T*3+L.x)*4,.1); L.vx=-20; if(seaLv<.3){ L.float=false; L.vy=100; } }
    else if(L.bounced) L.vy+=900*dt;
    if(eff.hush>0&&!L.safe&&!L.self){ L.y+=Math.sin(T*12+L.x)*.6; continue; }      // ゆめのことば：ふってくる文字が、とまる
    L.x+=L.vx*dt; L.y+=L.vy*dt; L.rot+=L.vr*dt;
    if(L.safe) continue;
    const cx=L.x+L.s/2, cy=L.y+L.s/2;
    // 雲の上には、ふってこない
    // （雲の下の文字は、雲から ふってくる）
    if(!L.self&&eff.barrier>0&&Math.hypot(cx-bub.x,cy-bub.y)<bub.r+L.s*.5){ // バリアではじく
      L.safe=L.bounced=true; const a=Math.atan2(cy-bub.y,cx-bub.x); L.vx=Math.cos(a)*380; L.vy=Math.sin(a)*380-200; L.vr=8*(Math.random()-.5);
      puff(cx,cy,8,195,{sp:150,r:5}); sfx('card',.5);
      continue;
    }
    if(!rew&&hit({x:P.x+3,y:P.y+3,w:P.w-6,h:P.h-6},{x:L.x+5,y:L.y+5,w:L.s-10,h:L.s-10})){ respawn(); break; }
    if(L.y+L.s>=GY&&!inPit(cx)){ L.dead=true; puff(cx,GY,4,0,{sp:90,s:0,l:50,r:5,kid:false,life:.4}); }
  }
  letters=letters.filter(L=>!L.dead&&L.y<900&&L.x>camX-300);

  if(P.y>820) respawn();
  updateParts(dt);
  if(eff.memory>0&&Math.random()<.5){ const list=ST.hidden.concat(ST.lanes.filter(l=>l.real)); const c=list[Math.floor(Math.random()*list.length)]; if(c) puff(c.x+Math.random()*c.w,c.y,1,50,{sp:20,r:4,grav:-40,life:.9}); }

  camX=lerp(camX,clamp(P.x-460,0,ST.len-W),clamp(dt*6,0,1));
  if(failN){ let cp=ST.cps[0]; for(const c of ST.cps) if(c<=P.x+10) cp=c; if(cp>failCp) failN=0; }      // つぎの ところまで すすんだら、みちびきを けす

  // ゴール：夕日が見える丘の家
  if(P.x>ST.goal-40){ S.mode='clear'; S.t=0; okT=0; charge=null; sfx('goal'); sfx('tadaima',curAge().voice); puff(ST.goal+90,ST.hill.top-90,50,45,{sp:260,up:120});
    // 「ただいま」は 年が上がるほど 小さくなる。15さいは、いわない
    const a=curAge(); shouts.push({text:['ただいま！','ただいま！','（ただいま）','（…ただいま）','……'][S.stage]||'ただいま！',hue:30,t:0,p:a.voice,v:a.voice}); }
  if(inFinalZone()) finalT+=dt;
}
function inPit(x){ for(const p of ST.pits) if(x>p.x&&x<p.x+p.w) return true; return false; }
const choiceBtn=i=>({x:W/2-480+i*325,y:250,w:310,h:150});
// あわせわざ・かべの話・むこうから くる言葉・石・白線・ブランコ・くるくる・みはらし台・雲の上
function updateExtras(dt,ax,jump){
  if(P.big>0) P.big-=dt; if(P.spin>0) P.spin-=dt;
  if(isBall()) addCombo('ball');
  if(eff.memory>0&&eff.shadow>0&&!ST.shadowPath){ ST.shadowPath=true; addCombo('kage'); }
  if(P.rideBoat) addCombo('boat');
  const surf=GY-waterH*seaLv;
  for(const b of ST.boats){ b.t+=dt;
    if(seaLv>.3){ b.y=surf-16+Math.sin(T*2+b.x*.01)*3; const nx=b.x+70*dt;
      if(!ST.walls.some(w=>!w.broken&&!w.door&&w.h>30&&nx+b.w>w.x&&nx<w.x+w.w)&&nx+b.w<ST.hill.x0){ if(P.rideBoat===b) P.x+=70*dt; b.x=nx; } }
    else if(eff.sea<=0){ b.y+=200*dt; if(b.y>GY+60) b.dead=true; } }
  ST.boats=ST.boats.filter(b=>!b.dead);
  // かべの まえで じっと まつと、かべが はなしだす
  let near=null; for(const w of ST.walls){ if(w.final||w.broken||w.low||w.old) continue; const d=w.x-(P.x+P.w); if(d>=-3&&d<140) near=w; }
  ST.near=near;
  if(near&&P.on&&ax===0&&!jump&&!charge&&Math.abs(P.vx)<40){ near.listen+=dt*(DT.passive==='listen'?2:1); if(near.listen>5.4) lowerWall(near); }
  // むこうから くる 大人の言葉。「かげ ふんだ！」のあいだ、かげを ふむと うごけない
  for(const c of ST.chasers){
    const len=c.text.length*c.s;
    if(!c.on){ if(P.x>c.x0-300&&P.x<c.x0-20){ c.on=true; c.cx=c.x0+c.w+130; c.frozen=0; c.drop=0; } else continue; }
    if(c.drop<1){ c.drop=Math.min(1,c.drop+dt*2.2); continue; }
    const feet=P.x+P.w/2, hush=eff.hush>0;
    if(eff.shadow>0&&feet>c.cx-shadowLen()&&feet<c.cx+8&&P.y+P.h>GY-80) c.frozen=3;
    if(hush) c.frozen=Math.max(c.frozen,.3);
    if(c.frozen>0) c.frozen-=dt; else c.cx-=150*dt;
    if(c.cx+len<c.x0-420){ c.on=false; continue; }
    if(c.frozen<=0&&hit(P,{x:c.cx+5,y:GY-c.s+5,w:len-10,h:c.s-5})){
      if(eff.barrier>0){ if(Math.random()<.3) puff(P.x+P.w/2,P.y+P.h/2,2,195,{sp:120,r:5}); }
      else { c.on=false; respawn(); return; }
    }
  }
  // けって はこべる 石
  const s=ST.stone;
  if(s&&!s.lost&&!s.done){
    if(!s.air&&P.on&&Math.abs(P.vx)>60&&Math.abs(P.x+P.w/2-s.x)<22){ if(Math.abs(s.vx)<100) sfx('jump'); s.vx=P.vx*1.7; }
    s.vx*=Math.pow(.2,dt); const nx=s.x+s.vx*dt;
    if(ST.walls.some(w=>!w.broken&&!w.door&&w.h>20&&nx+9>w.x&&nx-9<w.x+w.w)||nx<20) s.vx=0; else { s.moved+=Math.abs(nx-s.x); s.x=nx; }
    const hole=inPit(s.x)&&!ST.shadowPath&&!ST.drawn.some(q=>q.kind==='bridge'&&s.x>q.x&&s.x<q.x+q.w);
    if(s.air){ s.vy+=GRAV*dt; s.y+=s.vy*dt; if(s.y>GY-11){ if(!hole&&s.y<GY+24){ s.y=GY-11; s.air=false; s.vy=0; } else s.vx=0; } if(s.y>HH+60) s.lost=true; }
    else if(hole){ s.air=true; s.vy=0; }
    else if(Math.abs(s.vx)>200&&inPit(s.x+Math.sign(s.vx)*30)&&!ST.shadowPath){ s.air=true; s.vy=-740; }   // あなの てまえで、ぴょんと とぶ
    if(s.moved>260) addPlay('kick');
    if(s.x>ST.hill.x0-10){ s.done=true; stoneDone=true; addPlay('stone','いしを さいごまで はこんだ！'); puff(s.x,GY-12,40,45,{sp:240,up:160}); }
  }
  // 白線：白い ところだけを ふんで わたる
  const ln=ST.line;
  if(ln&&!ln.done){ const feet=P.x+P.w/2, end=ln.x+ln.n*120-50;
    if(feet<ln.x-12){ ln.on=false; ln.fail=false; }
    else if(feet<=end){ if(!ln.on&&!ln.fail) ln.on=true; if(P.on&&ln.on&&feet>ln.x&&(feet-ln.x)%120>76){ ln.on=false; ln.fail=true; sfx('fizz'); } }
    else if(ln.on){ ln.done=true; addPlay('line','はくせん、ふみきった！'); puff(feet,GY-10,30,50,{sp:200,up:140}); }
  }
  // 公園の ブランコ（↓ か「あそぶ」ボタン）／ ↓ を 2かいで くるくる
  const sx=ST.len*.47+121, down=pressed.has('ArrowDown')||pressed.has('KeyS');
  P.nearSwing=Math.abs(P.x+P.w/2-sx)<120&&P.on&&!inPit(P.x+P.w/2)&&!inFinalZone()&&!(playsBy[S.stage]||[]).includes('swing');
  if(P.nearSwing&&(down||pressed.has('KeyE'))){ swing={t:0}; P.vx=0; charge=null; }
  else if(down&&P.on&&!inFinalZone()){ if(T-lastDown<.45){ P.spin=.8; addPlay('spin','くるくる！'); } lastDown=T; }
  // みはらし台（いきどまり）
  if(P.onView&&!ST.viewed){ P.viewT=(P.viewT||0)+dt; if(P.viewT>.45){ ST.viewed=true; view={t:0}; P.vx=0; charge=null; addPlay('view'); sfx('bloom'); } } else P.viewT=0;
  // 雲の上
  if(P.onCloud&&!ST.clouded){ ST.clouded=true; addPlay('cloud',TEXT.cloud); }
}

const EPB={y:HH-76-62,h:46,a:{x:690,w:290},b:{x:992,w:276}};      // 人の 絵に かさならないよう、右がわに   // エピローグの えらぶボタン（8・9）
function updateEnding(dt,click,enter){
  END.t+=dt; updateParts(dt);
  tickWaves(dt);
  const kid=END.kid, wall=ST.walls[0], id=gift>=0?WORDS[gift].id:'';
  const tear=()=>{ if(Math.random()<.08) parts.push({x:kid.x+8,y:GY-34,vx:(Math.random()-.5)*30,vy:-40,life:0,max:.7,h:200,s:60*(1-kid.gray),l:75,r:3,grav:500,kid:true}); };
  const ax=(keys.ArrowRight||keys.KeyD||vkey.r?1:0)-(keys.ArrowLeft||keys.KeyA||vkey.l?1:0);
  // むかし あの言葉を いった ひとが、なにも いわずに うなずいて すれちがう
  const el=END.elder; el.x-=50*dt; el.nod=clamp(el.nod+(Math.abs(el.x-P.x)<120?dt*2.5:-dt*2),0,1);
  if(END.phase==='walk'){
    movePlayer(dt,ax,false); tear();
    if(P.x>kid.x-150){ P.x=kid.x-150; P.vx=0; END.phase='meet'; END.t=0; kid.cry=false; }
  } else if(END.phase==='meet'){ // こどもが かおを あげて、ひとこと。おとなは すこし わらって、しゃがむ
    movePlayer(dt,0,false); if(END.t>4.4||(END.t>1.5&&(enter||click))){ END.phase='choose'; END.t=0; kid.cry=true; }
  } else if(END.phase==='choose'){
    movePlayer(dt,0,false); tear();
    let k=-1;
    for(let i=0;i<GIFTS.length;i++) if(pressed.has('Digit'+(i+1))||pressed.has('Numpad'+(i+1))) k=GIFTS[i];
    if(pressed.has('Digit8')||pressed.has('Numpad8')) k=8;
    if(pressed.has('Digit9')||pressed.has('Numpad9')) k=9;
    if(click){ const c=slotAt(click.x,click.y); if(c!==null&&c>=0) k=c;
      if(click.y>=EPB.y&&click.y<=EPB.y+EPB.h){ if(click.x>=EPB.a.x&&click.x<=EPB.a.x+EPB.a.w) k=8; if(click.x>=EPB.b.x&&click.x<=EPB.b.x+EPB.b.w) k=9; } }
    if(END.t>.5){
      if(k>=0&&k<WORDS.length){ gift=k; epi='give'; END.phase='give'; END.t=0; sfx('act',.4); }
      else if(k===8){ gift=-1; epi='repeat'; END.phase='giveBad'; END.t=0; sfx('fizz'); }
      else if(k===9){ gift=-1; epi='pass'; END.phase='pass'; END.t=0; wall.ghost=true; }
    }
  } else if(END.phase==='give'){
    movePlayer(dt,0,false);
    if(END.t>2.8){ END.phase='shout'; END.t=0; kid.cry=false; kid.happy=true; END.ring={t:0,x:kid.x+10,y:GY-30};
      const w=WORDS[gift]; shouts.push({text:w.label,hue:w.hue,t:0,p:1.25,v:1.25}); sfx('shout',1); sfx('act',1);
      waves.push({x:kid.x+10,y:GY-30,t:0,hue:w.hue,v:1.4});
      puff(kid.x+10,GY-30,90,w.hue,{sp:420,r:10,up:100});
      if(id==='barrier') eff.barrier=99; if(id==='sea') eff.sea=6; if(id==='memory'){ eff.memory=99; ST.memorized=true; } if(id==='rewind') sfx('rewind');
    }
  } else if(END.phase==='shout'||((END.phase==='last'||END.phase==='home')&&epi==='give')){
    movePlayer(dt,(END.phase==='home'&&!END.arr)?1:0,false);
    END.sat=lerp(END.sat,1.15,clamp(dt*1.2,0,1)); END.sunk=lerp(END.sunk,.42,clamp(dt*.9,0,1));   // 色と夕日が戻る
    if(END.ring&&!END.ringDone){ END.ring.t+=dt; if(END.ring.t>RING_T){ END.ringDone=true; } }
    seaLv=lerp(seaLv,eff.sea>0?1:0,clamp(dt*2,0,1)); eff.sea=Math.max(0,eff.sea-dt);
    const tt=END.phase==='shout'?END.t:9;
    if(tt>1.1&&!wall.broken&&id!=='memory'){ shake=.5; sfx('break');
      // 6つの言葉で、かべの どきかたが ちがう
      if(id==='tidy') tidyWall(wall);
      else { wall.broken=true; const o={barrier:{sp:520,up:120},rewind:{sp:160,up:420,grav:-500},wind:{sp:260,up:60,vx:620,grav:120},sea:{sp:200,up:60,grav:-60}}[id]||{sp:460,up:160};
        for(let i=0;i<6;i++) puff(wall.x+35,wall.y+20+i*34,26,id==='sea'?205:i*60,Object.assign({r:10,spread:id==='sea'?40:120,life:1.8},o)); } }
    if(END.sat>.6&&Math.random()<.45) puff(camX+Math.random()*W,-10,1,Math.random()*360,{sp:30,r:6,grav:60,life:3,spread:0});
    if(END.phase==='shout'&&tt>4.4) kid.x+=dt*(id==='wind'?300:160);      // 「いきたい ところへ」のあと、子どもが先へかけていく
    if(END.phase==='shout'&&END.t>7.4){ END.phase='home'; END.t=0; wall.ghost=true; eff.barrier=0; eff.memory=0; }
    else if(END.phase==='home'){ // おとなは いえに かえり、明かりを つける。こどもが かえってきて「ただいま」→「おかえり」
      const hx=ST.house.x;
      if(!kid.stop) kid.x+=dt*(kid.back?-300:280);
      if(!END.arr){ if(P.x>hx+84){ END.arr=true; END.t=0; sfx('home'); kid.x=hx+760; kid.back=true; kid.dir=-1; } }
      else { END.light=Math.min(1,END.t/1.6);
        if(END.t>2&&kid.back&&kid.x<hx+176){ kid.x=hx+176; kid.stop=true; if(!END.said){ END.said=1; END.t2=0; shouts.push({text:'ただいま！',hue:30,t:0,p:1.1,v:1}); sfx('shout',1); } }
        if(END.t<=2&&kid.x<hx+700) kid.x=hx+700;
        if(END.said){ END.t2+=dt; if(END.said===1&&END.t2>1.6){ END.said=2; sfx('okaeri'); } if(END.t2>5.2){ END.phase='last'; END.t=0; sfx('goal'); } } }
    }
    else if(END.phase==='last'&&END.t>3&&(enter||click)){ S.mode='result'; S.t=0; saveEnding(endingId()); }
  } else if(END.phase==='giveBad'){ // おとなの ことばを いう → くりかえし
    movePlayer(dt,0,false); tear();
    if(END.t>2.8){ END.phase='bad'; END.t=0; kid.cry=false; }
  } else if(END.phase==='bad'){
    movePlayer(dt,0,false); kid.gray=lerp(kid.gray,1,clamp(dt*.8,0,1)); END.sat=lerp(END.sat,0,clamp(dt,0,1));
    if(END.t>4.5){ END.phase='last'; END.t=0; }
  } else if(END.phase==='pass'){ // なにも いわず とおりすぎる
    movePlayer(dt,1,false); tear();
    if(END.t>5.5||P.x>wall.x+420){ END.phase='last'; END.t=0; }
  } else if(END.phase==='last'){
    movePlayer(dt,epi==='pass'?1:0,false); if(epi==='pass') tear();
    if(END.t>3&&(enter||click)){ S.mode='result'; S.t=0; saveEnding(endingId()); }
  }
  const camT=epi==='pass'?clamp(kid.x-700,0,ST.len-W):clamp(P.x-380,0,ST.len-W);
  camX=lerp(camX,camT,clamp(dt*5,0,1));
}

  if(S.mode==='title'||S.mode==='howto'){ askDream(); }
  else if(S.mode==='dream'){ confirmDream(inp.value); S.mode='play'; }
  else if(S.mode==='intro'||S.mode==='play'||S.mode==='clear'){ if(S.stage<AGES.length-1){ startStage(S.stage+1); S.mode='play'; } else { S.mode='dark'; S.t=0; } }

  else if(S.mode==='ending'){ if(!epi){ gift=0; epi='give'; } S.mode='result'; S.t=0; saveEnding(endingId()); }
  else if(S.mode==='result'){ S.mode='title'; S.t=0; ST=null; }
}

let _grain=null;
function texPat(){ if(!_grain){ const c=document.createElement('canvas'); c.width=c.height=96; const q=c.getContext('2d');
    for(let i=0;i<900;i++){ const v=hash(i*3.1)<.5?255:10; q.fillStyle=`rgba(${v},${v},${v},${.03+hash(i*7.7)*.07})`; q.fillRect(hash(i)*96,hash(i+.5)*96,1+hash(i*1.3)*3,1+hash(i*2.9)*2); }
    _grain=g.createPattern(c,'repeat'); } return _grain; }
const sunRight=x=>Art.sunXY(camX).x>=x;
// かたまり（だん・足場・くい）。o.wood＝木、o.ground＝地面まで ある（長い影）、o.sx＝夕日の向きを きめる 画面の x
function slab(x,y,w,h,o={}){
  const wood=o.wood;
  if(o.ground) Art.longShadow(g,x+w/2,GY,w,Math.min(150,GY-y),camX);
  else if(o.shadow!==false){ g.fillStyle='rgba(14,8,34,.2)'; g.fillRect(x+7,y+h,w-6,7); }
  const gr=g.createLinearGradient(0,y,0,y+Math.max(h,1));
  gr.addColorStop(0,wood?acol('road',1,'sil',.38):acol('sil',1,'road',.44)); gr.addColorStop(1,wood?acol('road',1,'sil',.72):acol('sil',1,'road',.1));
  g.fillStyle=gr; g.fillRect(x,y,w,h);
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip(); g.fillStyle=texPat(); g.fillRect(x,y,w,h);
  if(wood){ g.strokeStyle='rgba(20,10,24,.26)'; g.lineWidth=1.5; if(w>h) for(let px=x+24;px<x+w-6;px+=27){ g.beginPath(); g.moveTo(px,y+2); g.lineTo(px,y+h); g.stroke(); } else for(let py=y+20;py<y+h-4;py+=23){ g.beginPath(); g.moveTo(x+1,py); g.lineTo(x+w*.6,py+2); g.stroke(); } }
  g.restore();
  const r=sunRight(o.sx!=null?o.sx:x+w/2), ew=Math.min(10,w*.5), ex=r?x+w-ew:x;
  const eg=g.createLinearGradient(ex,0,ex+ew,0); eg.addColorStop(r?0:1,acol('hz',0)); eg.addColorStop(r?1:0,acol('hz',.6)); g.fillStyle=eg; g.fillRect(ex,y,ew,h);
  g.fillStyle=acol('hz',.88); g.fillRect(x,y,w,2.5);
  g.fillStyle='rgba(10,6,24,.32)'; g.fillRect(x,y+h-2,w,2);
}

  let lo=0,hi=1; for(let i=0;i<14;i++){ const t=(lo+hi)/2, u=1-t, bx=u*u*u*x0+3*u*u*t*(h.x0+120)+3*u*t*t*(h.x0+240)+t*t*t*x1; if(bx<wx) lo=t; else hi=t; }
  const t=(lo+hi)/2, u=1-t; return u*u*u*(GY+2)+3*u*u*t*GY+3*u*t*t*h.top+t*t*t*h.top; }
